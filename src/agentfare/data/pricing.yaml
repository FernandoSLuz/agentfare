# AgentFare price table. USD per 1M tokens. Any price that could not be verified against the
# provider's official page is the literal string "unverified" (the CLI warns about it and does
# not count that model's spend). Source URL + date are recorded per model.
#
# Per model: input, cached_input (cache reads) and output are required (a number or "unverified").
# cache_write (5-minute cache writes) and cache_write_1h (1-hour cache writes) are optional. A field that
# is left out is billed at the input price (cache_write_1h: at the cache_write price when there is one).

schema: 1
