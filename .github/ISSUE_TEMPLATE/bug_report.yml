name: Bug report
description: Something does not work, or a number looks wrong
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Before you write, please check the [FAQ and troubleshooting](https://github.com/FernandoSLuz/agentfare#faq-and-troubleshooting) section of the README, and run `agentfare doctor`: it names most setup problems and says how to fix them.

        **Never paste your agent logs, prompts or file contents here.** AgentFare does not need them to find a bug. Describe the shape of a log instead, or build a small invented one. If you think you found a security problem, do not post it here: follow [SECURITY.md](https://github.com/FernandoSLuz/agentfare/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran, what you expected and what you got instead. Paste the error line or the output, after removing anything private.
      placeholder: "I ran `agentfare advise` and it printed ..."
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `agentfare doctor --json`
      description: |
        Run `agentfare doctor --json` and paste the result. It lists the checks of your install, config, log folders, database and price table, and it never opens a log file. If AgentFare does not start at all, say so and paste the error instead.

        The output can hold folder paths and your user name. Replace what you do not want to share before you paste it.
      render: json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AgentFare version
      description: The output of `agentfare --version`.
      placeholder: agentfare 0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - uv tool install
        - pipx
        - pip in a virtual environment
        - From a clone (pip install -e)
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and Python
      description: For example Ubuntu 24.04 with Python 3.12, or macOS 15 with Python 3.13.
    validations:
      required: true
  - type: input
    id: agents
    attributes:
      label: Agents and their versions
      description: Which of Claude Code, Codex CLI and Gemini CLI you use, with the output of their `--version`.
      placeholder: claude 2.1.284, codex 0.159.0
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem. `agentfare demo --keep ./agentfare-demo` gives you invented data to try it on, and the same steps on that data are the best report.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed prompts, file contents, private paths and project names from everything I pasted, and I did not paste any agent log.
          required: true
